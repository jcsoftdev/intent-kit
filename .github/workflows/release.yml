name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Plan release (lockstep versions, tag match, enabled packages)
        id: plan
        run: |
          {
            echo "dirs<<EOF"
            node scripts/release-plan.mjs "${GITHUB_REF_NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install npm 11.5.1 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.5.1
      - name: Publish enabled packages with provenance through OIDC trusted publishing
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -n "$dir" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            (cd "$dir" && pnpm run prepublishOnly)
            tarball_dir=$(mktemp -d)
            (cd "$dir" && pnpm pack --pack-destination "$tarball_dir")
            npm publish "$tarball_dir"/*.tgz --access public --provenance
          done <<< "${{ steps.plan.outputs.dirs }}"
